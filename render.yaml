databases:
  - name: agriconnect-preview-db
    databaseName: agriconnect
    user: agriconnect
    plan: free
    region: frankfurt

services:
  - type: web
    name: agriconnect-preview
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_READ_ONLY_PREVIEW
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: agriconnect-preview-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: agriconnect-preview-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: agriconnect-preview-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: agriconnect-preview-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: agriconnect-preview-db
          property: password
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug
